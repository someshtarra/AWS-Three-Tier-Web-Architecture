<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise Banking Platform on AWS</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 40px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .card { background: #1e293b; border-radius: 12px; padding: 32px; max-width: 600px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); border: 1px solid #334155; }
        h1 { color: #38bdf8; font-size: 24px; margin-top: 0; }
        p { color: #94a3b8; line-height: 1.6; }
        .badge { display: inline-block; background: #0284c7; color: white; padding: 4px 12px; border-radius: 9999px; font-size: 12px; font-weight: bold; margin-bottom: 16px; }
        .status { background: #064e3b; color: #34d399; padding: 12px; border-radius: 8px; font-family: monospace; }
    </style>
</head>
<body>
    <div class="card">
        <span class="badge">AWS Three-Tier Architecture</span>
        <h1>Enterprise Banking Platform</h1>
        <p>Production-ready Web Tier served via Amazon CloudFront, AWS WAF, and Application Load Balancer.</p>
        <div class="status">System Status: HEALTHY | Multi-AZ Active</div>
    </div>
</body>
</html>
