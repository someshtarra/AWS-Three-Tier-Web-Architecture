# Enterprise Nginx Configuration for Web Tier Reverse Proxy
server {
    listen 80 default_server;
    server_name _;

    # Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Health Check Endpoint
    location /healthz {
        access_log off;
        return 200 '{"status":"UP","tier":"web","timestamp":"$time_iso8601"}';
        add_header Content-Type application/json;
    }

    # Reverse Proxy to Application Tier EC2 / ASG Fleet
    location /api/ {
        proxy_pass http://10.0.5.10:8080/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static Web Presentation
    location / {
        root /var/www/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
